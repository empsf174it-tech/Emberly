<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Authentication — Emberly Coffee Lab</title>
  <meta name="description"
    content="Sign in or register for your Emberly Specialty Coffee Lab account to manage equipment orders, saved gear wishlists, and roast subscriptions." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Phosphor Icons CDN -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <!-- Master Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="auth-page-body">
  <!-- Accessible Skip Link -->
  <a href="#auth-card-main" class="skip-link">Skip to authentication card</a>

  <!-- Centered Auth Card Container (No Navbar, No Theme Toggle, No Back to Home) -->
  <main class="auth-wrapper" id="auth-card-main">
    <div class="auth-card">
      <!-- Brand Header -->
      <div class="auth-brand-head">
        <h1 class="auth-brand-logo" style="margin: 0;">
          <a href="index.html" class="brand-logo" aria-label="Emberly Homepage">
            <span class="brand-logo-mark"><i class="ph ph-coffee"></i></span>
            <span>Emberly</span>
          </a>
        </h1>
        <p style="font-size: 0.85rem; color: var(--color-text-muted); margin: 0;">Specialty Coffee Gear Lab</p>
      </div>

      <!-- Navigation Tabs: Login | Register -->
      <div class="auth-nav-tabs" role="tablist">
        <button type="button" class="auth-nav-tab active" id="auth-tab-login" role="tab" aria-selected="true"
          aria-controls="auth-pane-login">
          Sign In
        </button>
        <button type="button" class="auth-nav-tab" id="auth-tab-register" role="tab" aria-selected="false"
          aria-controls="auth-pane-register">
          Create Account
        </button>
      </div>

      <!-- TAB 1: LOGIN PANE -->
      <div id="auth-pane-login" role="tabpanel" aria-labelledby="auth-tab-login">
        <form id="auth-login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
            <div class="input-wrap">
              <i class="ph ph-envelope-simple input-icon" aria-hidden="true"></i>
              <input type="email" id="login-email" class="form-input" placeholder="barista@domain.com" required
              autocomplete="username" />
            </div>
            <div class="form-feedback"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password <span class="required">*</span></label>
            <div class="input-wrap has-toggle">
              <i class="ph ph-lock-simple input-icon" aria-hidden="true"></i>
              <input type="password" id="login-password" class="form-input" placeholder="Min. 8 characters" required
              autocomplete="current-password" />
              <button type="button" class="password-toggle" aria-label="Show password" aria-controls="login-password"><i class="ph ph-eye"></i></button>
            </div>
            <div class="form-feedback"></div>
          </div>

          <div class="auth-options-row">
            <label class="form-check">
              <input type="checkbox" id="login-remember" checked />
              <span class="form-check-label">Remember me</span>
            </label>
            <a href="#" class="auth-forgot-link"
              onclick="event.preventDefault(); showToast('Demo password reset link dispatched to email.');">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Sign In to Account <i class="ph ph-arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider">
          <span>Or continue with</span>
        </div>

        <div class="auth-social-btns">
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoSocialAuth('Google')"
            style="width: 100%; justify-content: center; gap: 8px;">
            <svg class="social-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg> Continue with Google
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoSocialAuth('Apple')"
            style="width: 100%; justify-content: center; gap: 8px;">
            <svg class="social-logo" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg> Continue with Apple
          </button>
        </div>

        <p style="font-size: 0.85rem; margin-top: 16px; color: var(--color-text-muted);">
          Don't have an account yet? <a href="#" class="switch-to-register"
            style="color: var(--color-accent); font-weight: 600;">Register now</a>
        </p>
      </div>

      <!-- TAB 2: REGISTER PANE -->
      <div id="auth-pane-register" role="tabpanel" aria-labelledby="auth-tab-register" style="display: none;">
        <form id="auth-register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
            <div class="input-wrap">
              <i class="ph ph-user input-icon" aria-hidden="true"></i>
              <input type="text" id="reg-name" class="form-input" placeholder="Julian Keller" required
              autocomplete="name" />
            </div>
            <div class="form-feedback"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
            <div class="input-wrap">
              <i class="ph ph-envelope-simple input-icon" aria-hidden="true"></i>
              <input type="email" id="reg-email" class="form-input" placeholder="julian@example.com" required
              autocomplete="email" />
            </div>
            <div class="form-feedback"></div>
          </div>

          <div class="auth-password-pair">
            <div class="form-group">
              <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
              <div class="input-wrap has-toggle">
                <i class="ph ph-lock-simple input-icon" aria-hidden="true"></i>
                <input type="password" id="reg-password" class="form-input" placeholder="8+ chars" required
                autocomplete="new-password" />
                <button type="button" class="password-toggle" aria-label="Show password" aria-controls="reg-password"><i class="ph ph-eye"></i></button>
              </div>
              <div class="form-feedback"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-confirm-password">Confirm <span class="required">*</span></label>
              <div class="input-wrap has-toggle">
                <i class="ph ph-lock-simple input-icon" aria-hidden="true"></i>
                <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat" required
                autocomplete="new-password" />
                <button type="button" class="password-toggle" aria-label="Show password" aria-controls="reg-confirm-password"><i class="ph ph-eye"></i></button>
              </div>
              <div class="form-feedback"></div>
            </div>
          </div>

          <!-- Mandatory Terms checkbox that strictly blocks submit -->
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-check">
              <input type="checkbox" id="reg-terms" required />
              <span class="form-check-label" style="font-size: 0.78rem;">
                I accept the <a href="#" style="text-decoration: underline;"
                  onclick="event.preventDefault(); showToast('Emberly Terms of Service: Standard demo conditions apply.');">Terms
                  of Service</a> &amp; Privacy Policy. <span class="required">*</span>
              </span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Create Account <i class="ph ph-check"></i>
          </button>
        </form>

        <div class="auth-divider">
          <span>Or sign up with</span>
        </div>

        <div class="auth-social-btns">
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoSocialAuth('Google')"
            style="width: 100%; justify-content: center; gap: 8px;">
            <svg class="social-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg> Register with Google
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="demoSocialAuth('Apple')"
            style="width: 100%; justify-content: center; gap: 8px;">
            <svg class="social-logo" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg> Register with Apple
          </button>
        </div>

        <p style="font-size: 0.85rem; margin-top: 16px; color: var(--color-text-muted);">
          Already have an account? <a href="#" class="switch-to-login"
            style="color: var(--color-accent); font-weight: 600;">Sign in</a>
        </p>
      </div>

      <!-- Secure Connection Shield Badge -->
      <div class="auth-security-badge">
        <i class="ph ph-lock-key" style="color: var(--color-success); font-size: 1rem;"></i>
        <span>256-Bit SSL Encrypted Connection &bull; Demo Sandbox</span>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
